name: Fix all Machinepark search

on:
  push:
    branches:
      - development
    paths:
      - '.github/workflows/fix-all-search.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - name: Run search patch
        run: python scripts/fix-all-search.py
      - name: Commit search fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Herstel zoeken in alle Machinepark schermen"
          git push origin development
