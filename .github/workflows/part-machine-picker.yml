name: Part machine picker

on:
  push:
    branches:
      - development
    paths:
      - '.github/workflows/part-machine-picker.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - name: Apply part machine picker
        run: python scripts/part-machine-picker.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Voeg machinekeuze toe bij onderdelen"
          git push origin development
