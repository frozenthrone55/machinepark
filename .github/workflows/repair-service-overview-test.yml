name: Herstel service-overview regressietest

on:
  push:
    branches:
      - synology-selfhost

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Synology-bron
        uses: actions/checkout@v5

      - name: Pas alleen de verouderde serviceView-assertions aan
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/actions.test.mjs')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('  assert.match(dashboard, /panel\\.parentNode!==view/);', '  assert.match(dashboard, /panel\\.parentNode!==serviceView/);'),
              ('  assert.match(dashboard, /view\\.appendChild\\(panel\\)/);', '  assert.match(dashboard, /serviceView\\.appendChild\\(panel\\)/);'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Verwacht exact 1 oude service-overview assertion, gevonden: {count}: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verwijder tijdelijke reparatieworkflow en commit de testfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-service-overview-test.yml
          git add tests/actions.test.mjs
          git diff --cached --check
          git commit -m "Align service overview regression with serviceView refactor"
          git push origin HEAD:synology-selfhost
