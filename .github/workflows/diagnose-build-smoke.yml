name: Diagnose Outlook Classic runtime

on:
  push:
    branches:
      - synology-selfhost
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-outlook-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Synology-bron
        uses: actions/checkout@v5

      - name: Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependencies installeren
        run: npm install --ignore-scripts

      - name: Machinepark bouwen
        run: npm run build

      - name: Synology runtime samenstellen
        run: |
          rm -rf /tmp/machinepark-synology
          python3 scripts/package-synology-runtime.py --output /tmp/machinepark-synology

      - name: Outlook runtime exact diagnosticeren
        id: outlook_diag
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          runtime = Path('/tmp/machinepark-synology')
          report = []
          failures = []

          js_path = runtime / 'assets/machinepark-build.js'
          setup_path = runtime / 'machinepark-outlook-classic-setup.cmd'

          def record(label, ok, detail=''):
              status = 'PASS' if ok else 'FAIL'
              line = f'{status} | {label}'
              if detail:
                  line += f' | {detail}'
              print(line)
              report.append(line)
              if not ok:
                  failures.append(label)

          record('runtime JS bestaat', js_path.exists(), str(js_path))
          record('Outlook setup bestaat', setup_path.exists(), str(setup_path))

          js = js_path.read_text(encoding='utf-8') if js_path.exists() else ''
          setup = setup_path.read_text(encoding='utf-8') if setup_path.exists() else ''

          required_js = [
              'machinepark-outlook-classic-bridge-v3',
              'function machineparkOutlookPendingRequest(context)',
              'function machineparkLaunchOutlookPending(request)',
              'machinepark-outlook://compose?file=',
              "const outlookRequest = machineparkIsWindowsDesktop() ? machineparkOutlookPendingRequest(context) : null;",
              'machineparkLaunchOutlookPending(outlookRequest);',
              "await createDirectPdf(context, outlookRequest?.fileName || '');",
              'navigator.share(shareData)',
              'Outlook Classic koppelen',
          ]
          for i, token in enumerate(required_js, 1):
              record(f'JS token {i}', token in js, token)

          direct_token = "const outlookRequest = machineparkIsWindowsDesktop() ? machineparkOutlookPendingRequest(context) : null;"
          launch_token = 'machineparkLaunchOutlookPending(outlookRequest);'
          pdf_token = "await createDirectPdf(context, outlookRequest?.fileName || '');"
          if all(token in js for token in (direct_token, launch_token, pdf_token)):
              direct_start = js.index(direct_token)
              launch_at = js.index(launch_token, direct_start)
              pdf_await_at = js.index(pdf_token, direct_start)
              record('protocolstart vóór PDF-await', launch_at < pdf_await_at, f'launch={launch_at}, pdf={pdf_await_at}')
          else:
              record('protocolstart vóór PDF-await', False, 'één of meer vereiste tokens ontbreken')

          launch_start_token = 'function machineparkLaunchOutlookPending(request)'
          launch_end_token = 'function machineparkDownloadOutlookClassicSetup()'
          if launch_start_token in js and launch_end_token in js:
              launch_start = js.index(launch_start_token)
              launch_end = js.index(launch_end_token, launch_start)
              launch_block = js[launch_start:launch_end]
              record('directe protocol-click aanwezig', 'anchor.click();' in launch_block)
              record('protocolstart zonder setTimeout', 'setTimeout' not in launch_block)
              record('protocolstart zonder await', 'await ' not in launch_block)
          else:
              record('launch-functie afbakenen', False, 'start- of eindfunctie ontbreekt')

          required_setup = [
              "HKCU:\\Software\\Classes\\machinepark-outlook",
              "NameSpace('shell:Downloads')",
              'AddSeconds(60)',
              'New-Object -ComObject Outlook.Application',
              '$mail.Attachments.Add($pdf.FullName)',
              '$mail.Display()',
              'machinepark-outlook-installer-loader-v2',
              "[regex]::Match($raw,'(?m)^###MACHINEPARK_POWERSHELL###\\r?$')",
          ]
          for i, token in enumerate(required_setup, 1):
              record(f'SETUP token {i}', token in setup, token)

          report_path = Path('/tmp/outlook-runtime-diagnostic.txt')
          report_path.write_text('\n'.join(report) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'failures={len(failures)}\n')
          print(f'Totaal fouten: {len(failures)}')
          PY

      - name: Outlook diagnose vastleggen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outlook-runtime-diagnostic
          path: /tmp/outlook-runtime-diagnostic.txt
          retention-days: 1

      - name: Diagnose bewaken
        if: steps.outlook_diag.outputs.failures != '0'
        run: |
          echo "Outlook runtime bevat ${{ steps.outlook_diag.outputs.failures }} falende controles."
          exit 1
