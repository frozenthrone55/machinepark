name: Herstel Machinepark inline JavaScript

on:
  push:
    branches: [development]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - name: Verwijder extra afsluitende accolade
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(r'(function renderProfessionalDashboard\(\)\{[^\n]*\}\n)\}\n(function renderAll\(\))')
          fixed, n = pattern.subn(r'\1\2', s, count=1)
          if n != 1:
              raise SystemExit(f'Verwachtte exact 1 syntaxherstel, vond {n}')
          p.write_text(fixed, encoding='utf-8')
          PY
          rm .github/workflows/repair-inline-js.yml
      - name: Commit herstel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/repair-inline-js.yml
          git commit -m "Herstel navigatie en actieknoppen"
          git push origin development
