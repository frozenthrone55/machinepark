name: Fix dashboard search

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/fix-dashboard-search.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - name: Patch globale zoekfunctie
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_css = ".search span{position:absolute;left:13px;top:10px;color:var(--muted)}"
          new_css = old_css + "\n.global-search-results{position:absolute;z-index:1500;top:calc(100% + 8px);right:0;width:min(520px,88vw);max-height:440px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(20,45,38,.18);display:none}.global-search-results.show{display:block}.global-search-head{padding:9px 12px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:#f8faf9;border-bottom:1px solid var(--line)}.global-search-result{width:100%;border:0;border-bottom:1px solid #edf1ef;background:#fff;padding:11px 13px;text-align:left;cursor:pointer;display:grid;gap:3px;color:var(--text)}.global-search-result:last-child{border-bottom:0}.global-search-result:hover,.global-search-result:focus{background:#f3f7f5;outline:none}.global-search-result strong{font-size:13px}.global-search-result small{font-size:11px;color:var(--muted)}.global-search-empty{padding:18px;text-align:center;color:var(--muted);font-size:13px}"
          if old_css in s and 'global-search-results{' not in s:
              s = s.replace(old_css, new_css, 1)

          old_html = '<div class="top-actions"><div class="search"><span>⌕</span><input id="globalSearch" placeholder="Zoek toestel, locatie, onderdeel…" /></div><button class="btn primary" id="quickAdd">+ Nieuw</button></div>'
          new_html = '<div class="top-actions"><div class="search"><span>⌕</span><input id="globalSearch" autocomplete="off" placeholder="Zoek toestel, locatie, onderdeel…" /><div id="globalSearchResults" class="global-search-results" role="listbox" aria-label="Zoekresultaten"></div></div><button class="btn primary" id="quickAdd">+ Nieuw</button></div>'
          if old_html in s:
              s = s.replace(old_html, new_html, 1)

          marker = "function pageMeta(view){return {"
          search_js = '''function renderGlobalSearchResults(){\n const box=$('#globalSearchResults'),input=$('#globalSearch');if(!box||!input)return;\n const q=String(state.query||'').trim().toLowerCase();\n if(!q){box.classList.remove('show');box.innerHTML='';return}\n const deviceMatches=state.devices.filter(d=>{const fields=[d.assetCode,d.brand,d.model,d.serial,d.notes];return fields.some(v=>String(v||'').toLowerCase().includes(q))||locationEvents(d).some(e=>String(e.location||'').toLowerCase().includes(q))}).slice(0,8);\n const partMatches=state.parts.filter(p=>[p.artNr,p.description,p.deviceBrand,p.supplierCode,p.warehouse].some(v=>String(v||'').toLowerCase().includes(q))).slice(0,8);\n let html='';\n if(deviceMatches.length){html+='<div class="global-search-head">Toestellen & locaties</div>'+deviceMatches.map(d=>`<button type="button" class="global-search-result" data-global-device="${d.id}"><strong>☕ ${esc(d.assetCode||d.model||'Toestel')}</strong><small>${esc(deviceLocationAt(d)||'Geen locatie')} · ${esc([d.brand,d.model].filter(Boolean).join(' ')||'Geen toesteltype')}</small></button>`).join('')}\n if(partMatches.length){html+='<div class="global-search-head">Onderdelen</div>'+partMatches.map(p=>`<button type="button" class="global-search-result" data-global-part="${p.id}"><strong>▣ ${esc(p.artNr||'—')} · ${esc(p.description||'Onderdeel')}</strong><small>${esc(p.deviceBrand||'Geen merk')} · voorraad ${Number(p.stock||0)}</small></button>`).join('')}\n if(!html)html='<div class="global-search-empty">Geen toestellen, locaties of onderdelen gevonden.</div>';\n box.innerHTML=html;box.classList.add('show');\n}\nfunction closeGlobalSearch(){const box=$('#globalSearchResults');if(box)box.classList.remove('show')}\n'''
          if marker in s and 'function renderGlobalSearchResults()' not in s:
              s = s.replace(marker, search_js + marker, 1)

          old_bind = "$('#globalSearch').oninput=e=>{state.query=e.target.value.trim();renderAll()};"
          new_bind = "$('#globalSearch').oninput=e=>{state.query=e.target.value.trim();renderAll();renderGlobalSearchResults()};$('#globalSearch').onfocus=()=>{if(state.query)renderGlobalSearchResults()};$('#globalSearch').onkeydown=e=>{if(e.key==='Escape'){closeGlobalSearch();e.target.blur()}else if(e.key==='Enter'){const first=$('#globalSearchResults .global-search-result');if(first){e.preventDefault();first.click()}}};"
          if old_bind in s:
              s = s.replace(old_bind, new_bind, 1)

          old_click = "document.body.addEventListener('click',e=>{const genericSortHead=e.target.closest('.table:not(.device-table) th.table-sortable');"
          new_click = "document.body.addEventListener('click',e=>{const gd=e.target.closest('[data-global-device]');if(gd){closeGlobalSearch();showDeviceHistory(gd.dataset.globalDevice);return}const gp=e.target.closest('[data-global-part]');if(gp){closeGlobalSearch();openPart(gp.dataset.globalPart);return}if(!e.target.closest('.search'))closeGlobalSearch();const genericSortHead=e.target.closest('.table:not(.device-table) th.table-sortable');"
          if old_click in s:
              s = s.replace(old_click, new_click, 1)

          required = ['globalSearchResults','function renderGlobalSearchResults()','data-global-device','data-global-part']
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit('Patch onvolledig: '+', '.join(missing))
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit zoekfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Maak dashboard zoekfunctie globaal werkend"
          git push origin development
