name: Eenmalig export afbeeldingen v2

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/one-time-export-images-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pas exports aan
        run: python3 scripts/one-time-export-images.py
      - name: Verwijder tijdelijk script
        run: rm scripts/one-time-export-images.py
      - name: Test Machinepark
        run: npm test
      - name: Controleer serverfuncties
        run: npm run check:functions
      - name: Commit appwijziging
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js package.json tests/build-smoke.test.mjs scripts/build-machinepark.py scripts/one-time-export-images.py
          git commit -m 'Neem afbeeldingen mee in exports'
          git push origin HEAD:development
