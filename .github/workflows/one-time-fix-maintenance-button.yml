name: Eenmalig herstel onderhoudsknop

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/one-time-fix-maintenance-button.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Herstel onderhoudsknop en borg test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "$('#addMaintenance').onclick=openMaintenance;"
          new = "$('#addMaintenance').onclick=()=>openMaintenance();"
          if old not in s:
              raise SystemExit('Onderhoudsknop binding niet gevonden')
          s = s.replace(old, new, 1)
          s = s.replace('v1.55 • Onderhoud per locatie', 'v1.56 • Onderhoudsknop hersteld', 1)
          p.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          w = sw.read_text(encoding='utf-8')
          w = w.replace('machinepark-v1.55-maintenance-by-location', 'machinepark-v1.56-maintenance-button-fix')
          sw.write_text(w, encoding='utf-8')

          build = Path('scripts/build-machinepark.py')
          b = build.read_text(encoding='utf-8')
          b = b.replace('machinepark-v1.55-maintenance-by-location', 'machinepark-v1.56-maintenance-button-fix')
          if '"onderhoud knop": "$(\'#addMaintenance\').onclick=()=>openMaintenance();",' not in b:
              b = b.replace('"onderhoud navigatie": "data-view=\\"maintenance\\"",', '"onderhoud navigatie": "data-view=\\"maintenance\\"",\n    "onderhoud knop": "$(\'#addMaintenance\').onclick=()=>openMaintenance();",')
          build.write_text(b, encoding='utf-8')

          test = Path('tests/build-smoke.test.mjs')
          t = test.read_text(encoding='utf-8')
          marker = "    'data-view=\"maintenance\"',"
          if "$('#addMaintenance').onclick=()=>openMaintenance();" not in t:
              t = t.replace(marker, marker + "\n    \"$('#addMaintenance').onclick=()=>openMaintenance();\",")
          t = t.replace('machinepark-v1.55-maintenance-by-location', 'machinepark-v1.56-maintenance-button-fix')
          t = t.replace('service worker forceert nieuwe cache na locatiegericht onderhoud', 'service worker forceert nieuwe cache na herstel onderhoudsknop')
          test.write_text(t, encoding='utf-8')
          PY
      - name: Test Machinepark
        run: npm test
      - name: Verwijder eenmalige workflow en commit
        run: |
          rm .github/workflows/one-time-fix-maintenance-button.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js scripts/build-machinepark.py tests/build-smoke.test.mjs .github/workflows/one-time-fix-maintenance-button.yml
          git commit -m "Herstel knop onderhoud registreren"
          git push origin HEAD:development
