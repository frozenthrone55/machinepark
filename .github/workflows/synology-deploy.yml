name: Bouw Synology-versie

on:
  push:
    branches:
      - synology-selfhost
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: machinepark-synology-deploy
  cancel-in-progress: true

jobs:
  build-synology:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Synology-bron
        uses: actions/checkout@v5

      - name: Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependencies installeren
        run: npm install --ignore-scripts

      - name: Machinepark bouwen
        run: npm run build

      - name: Netlify-functies controleren
        run: npm run check:functions

      - name: Code-audit
        run: npm run audit

      - name: Outlook installer regressietest
        run: node --test tests/outlook-classic-installer.test.mjs

      - name: Bestaande regressietests diagnosticeren
        id: existing-regressions
        shell: bash
        run: |
          set +e
          failed=''
          while IFS= read -r -d '' testfile; do
            echo "==> $testfile"
            node --test "$testfile"
            rc=$?
            if [ "$rc" -ne 0 ] && [ -z "$failed" ]; then
              failed="$(basename "$testfile")"
            fi
          done < <(find tests -maxdepth 1 -name '*.test.mjs' ! -name 'outlook-classic-installer.test.mjs' -print0 | sort -z)
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          if [ -n "$failed" ]; then
            printf '%s\n' "$failed" > /tmp/machinepark-failing-regression.txt
          fi
          exit 0

      - name: Acties-regressie exact diagnosticeren
        id: actions-regression
        if: steps.existing-regressions.outputs.failed == 'actions.test.mjs'
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          path = Path('tests/actions.test.mjs')
          source = path.read_text(encoding='utf-8')
          titles = re.findall(r"test\('([^']+)'", source)
          failed_title = ''
          failed_line = ''
          failed_output = ''

          for title in titles:
              pattern = '^' + re.escape(title) + '$'
              result = subprocess.run(
                  ['node', '--test', '--test-name-pattern', pattern, str(path)],
                  text=True,
                  capture_output=True,
              )
              if result.returncode != 0:
                  failed_title = title
                  failed_output = (result.stdout or '') + '\n' + (result.stderr or '')
                  match = re.search(r'actions\.test\.mjs:(\d+):', failed_output)
                  if match:
                      failed_line = match.group(1)
                  break

          if not failed_title:
              raise SystemExit('actions.test.mjs faalde als geheel, maar geen afzonderlijke subtest kon worden geïsoleerd.')

          slug = re.sub(r'[^A-Za-z0-9]+', '-', failed_title).strip('-').lower()[:80]
          if failed_line:
              slug = f'line-{failed_line}-{slug}'
          Path('/tmp/machinepark-failing-actions-subtest.txt').write_text(
              f'{failed_title}\nline={failed_line}\n\n{failed_output}',
              encoding='utf-8',
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'slug={slug}\n')
              output.write(f'title={failed_title}\n')
              output.write(f'line={failed_line}\n')
          print('Falende actions-subtest:', failed_title)
          print('Regel:', failed_line or 'onbekend')
          PY

      - name: Foutende regressietest vastleggen
        if: steps.existing-regressions.outputs.failed != ''
        uses: actions/upload-artifact@v4
        with:
          name: failing-regression-${{ steps.existing-regressions.outputs.failed }}
          path: /tmp/machinepark-failing-regression.txt
          retention-days: 1

      - name: Foutende Actions-subtest vastleggen
        if: steps.actions-regression.outputs.slug != ''
        uses: actions/upload-artifact@v4
        with:
          name: failing-actions-subtest-${{ steps.actions-regression.outputs.slug }}
          path: /tmp/machinepark-failing-actions-subtest.txt
          retention-days: 1

      - name: Bestaande regressietests bewaken
        if: steps.existing-regressions.outputs.failed != ''
        run: |
          echo "Falende regressietest: ${{ steps.existing-regressions.outputs.failed }}"
          echo "Falende Actions-subtest: ${{ steps.actions-regression.outputs.title }}"
          exit 1

      - name: Lokale Synology-data en login controleren
        run: |
          php -l synology/api/_role-lib.php
          php -l synology/api/_auth-lib.php
          php -l synology/api/_audit-lib.php
          php -l synology/api/auth.php
          php -l synology/api/machinepark-data.php
          php -l synology/api/fault-library.php
          php -l synology/api/user-management.php
          php -l synology/api/role-management.php
          php -l synology/api/audit-log.php
          php -l synology/api/manual-library.php
          php -l synology/api/work-order-templates.php
          php -l synology/api/_photo-lib.php
          php -l synology/api/device-photos.php
          php -l synology/api/part-photos.php
          php -l synology/api/service-photos.php
          php -l synology/api/action-photos.php
          php -l synology/api/purge-service-audit-photos.php
          php -l synology/migrate-data.php
          php -l synology/migrate-media.php
          php -l synology/import-cloud.php
          php -l synology/admin-recovery.php
          php tests/synology-access-policy.php
          node --check synology-local-auth.js
          node --test tests/synology-local-data.test.mjs tests/synology-migrate-data.test.mjs tests/synology-local-auth.test.mjs tests/synology-local-admin.test.mjs tests/synology-local-content.test.mjs tests/synology-local-faults.test.mjs tests/synology-local-photos.test.mjs tests/synology-local-vendor.test.mjs tests/synology-media-migration.test.mjs tests/synology-cloud-import.test.mjs tests/synology-admin-recovery.test.mjs tests/synology-secure-access.test.mjs tests/synology-runtime-paths.test.mjs

      - name: Synology runtime samenstellen
        run: |
          rm -rf /tmp/machinepark-synology
          python3 scripts/package-synology-runtime.py --output /tmp/machinepark-synology

      - name: Outlook Classic runtime controleren
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path('/tmp/machinepark-synology')
          js = (runtime / 'assets/machinepark-build.js').read_text(encoding='utf-8')
          setup = (runtime / 'machinepark-outlook-classic-setup.cmd').read_text(encoding='utf-8')

          required_js = [
              'machinepark-outlook-classic-bridge-v3',
              'function machineparkOutlookPendingRequest(context)',
              'function machineparkLaunchOutlookPending(request)',
              'machinepark-outlook://compose?file=',
              "const outlookRequest = machineparkIsWindowsDesktop() ? machineparkOutlookPendingRequest(context) : null;",
              'machineparkLaunchOutlookPending(outlookRequest);',
              "await createDirectPdf(context, outlookRequest?.fileName || '');",
              'navigator.share(shareData)',
              'Outlook Classic koppelen',
          ]
          for token in required_js:
              if token not in js:
                  raise SystemExit('Outlook runtime-validatie mislukt: ontbreekt in runtime JS: ' + token)

          direct_start = js.index('const outlookRequest = machineparkIsWindowsDesktop() ? machineparkOutlookPendingRequest(context) : null;')
          launch_at = js.index('machineparkLaunchOutlookPending(outlookRequest);', direct_start)
          pdf_await_at = js.index("await createDirectPdf(context, outlookRequest?.fileName || '');", direct_start)
          if launch_at >= pdf_await_at:
              raise SystemExit('Outlook runtime-validatie mislukt: protocolstart gebeurt niet vóór PDF-opbouw/await.')

          launch_start = js.index('function machineparkLaunchOutlookPending(request)')
          launch_end = js.index('function machineparkDownloadOutlookClassicSetup()', launch_start)
          launch_block = js[launch_start:launch_end]
          if 'anchor.click();' not in launch_block:
              raise SystemExit('Outlook runtime-validatie mislukt: directe protocol-click ontbreekt.')
          if 'setTimeout' in launch_block or 'await ' in launch_block:
              raise SystemExit('Outlook runtime-validatie mislukt: protocolstart is opnieuw asynchroon gemaakt.')

          required_setup = [
              "HKCU:\\Software\\Classes\\machinepark-outlook",
              "NameSpace('shell:Downloads')",
              'AddSeconds(60)',
              'New-Object -ComObject Outlook.Application',
              '$mail.Attachments.Add($pdf.FullName)',
              '$mail.Display()',
              'machinepark-outlook-installer-temp-ps1-v3',
              "[regex]::Match($raw,'(?m)^###MACHINEPARK_POWERSHELL###\\r?$')",
          ]
          for token in required_setup:
              if token not in setup:
                  raise SystemExit('Outlook runtime-validatie mislukt: ontbreekt in helper: ' + token)

          print('Outlook Classic runtime-validatie OK: veilige payload-marker, protocol vóór await, PDF-wachtlus en automatische bijlage aanwezig.')
          PY

      - name: Versie-informatie schrijven
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          Path("/tmp/machinepark-synology/deploy-meta.json").write_text(
              json.dumps({
                  "source_sha": os.environ["SOURCE_SHA"],
                  "built_at": datetime.now(timezone.utc).isoformat(),
                  "source_branch": "synology-selfhost"
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Publiceer kant-en-klare Synology branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/machinepark-synology
          git init
          git checkout -b synology-deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Synology build van ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin synology-deploy
