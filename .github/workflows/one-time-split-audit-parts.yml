name: Eenmalig apart onderdelenlogboek

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/one-time-split-audit-parts.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Splits wijzigingslogboek
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_css = '#auditLogScroll .table th{position:sticky;top:0;z-index:3;background:#f8faf9}'
          new_css = '#auditLogScroll .table th,#auditPartsLogScroll .table th{position:sticky;top:0;z-index:3;background:#f8faf9}'
          if old_css not in s:
              raise SystemExit('audit CSS anchor niet gevonden')
          s = s.replace(old_css, new_css, 1)

          old_html = '''          <div id="auditLogStatus" class="muted" style="font-size:12px;margin-bottom:10px">Logboek wordt geladen…</div>
          <div class="table-wrap" id="auditLogScroll" style="max-height:min(620px,65vh);overflow:auto;overscroll-behavior:contain"><table class="table" style="min-width:1020px"><thead><tr><th>Wanneer</th><th>Wie</th><th>Wat</th><th>Wijziging</th><th>Actie</th></tr></thead><tbody id="auditLogBody"></tbody></table></div>'''
          new_html = '''          <div id="auditLogStatus" class="muted" style="font-size:12px;margin-bottom:10px">Logboek wordt geladen…</div>
          <div class="section-title" style="margin:4px 0 9px">Overige wijzigingen</div>
          <div class="table-wrap" id="auditLogScroll" style="max-height:min(520px,58vh);overflow:auto;overscroll-behavior:contain"><table class="table" style="min-width:1020px"><thead><tr><th>Wanneer</th><th>Wie</th><th>Wat</th><th>Wijziging</th><th>Actie</th></tr></thead><tbody id="auditLogBody"></tbody></table></div>
          <div class="section-title" style="margin:18px 0 9px">Onderdelen</div>
          <div id="auditPartsStatus" class="muted" style="font-size:12px;margin-bottom:10px">Onderdeelwijzigingen worden geladen…</div>
          <div class="table-wrap" id="auditPartsLogScroll" style="max-height:min(420px,52vh);overflow:auto;overscroll-behavior:contain"><table class="table" style="min-width:1020px"><thead><tr><th>Wanneer</th><th>Wie</th><th>Wat</th><th>Wijziging</th><th>Actie</th></tr></thead><tbody id="auditPartsLogBody"></tbody></table></div>'''
          if old_html not in s:
              raise SystemExit('audit HTML anchor niet gevonden')
          s = s.replace(old_html, new_html, 1)

          replacement = r'''function auditRowHtml({entry,change,changeIndex}){return `<tr><td class="nowrap">${adminDateFmt(entry.at)}</td><td><strong>${esc(entry.userName||entry.userEmail||'Gebruiker')}</strong>${entry.userName&&entry.userEmail?`<br><span class="muted">${esc(entry.userEmail)}</span>`:''}</td><td><strong>${esc(change.entityType||'Item')}</strong><br><span class="muted">${esc(change.entityLabel||'')}</span></td><td><span class="badge ${change.action==='verwijderd'?'danger':change.action==='toegevoegd'||change.action==='uitgenodigd'?'success':change.action==='ongedaan gemaakt'?'blue':'gray'}">${esc(change.action||'gewijzigd')}</span><div style="margin-top:6px;font-size:12px;line-height:1.5">${auditDetails(change)}</div>${Number(change.linkedUndoCount||0)>0?`<div class="muted" style="font-size:11px;margin-top:5px">↳ ${Number(change.linkedUndoCount)} gekoppelde voorraadwijziging(en)</div>`:''}</td><td class="nowrap">${auditUndoButton(entry,change,changeIndex)}</td></tr>`}
function auditEmptyRow(text){return `<tr><td colspan="5"><div class="empty">${esc(text)}</div></td></tr>`}
async function loadAuditLog(){if(!window.machineparkIsAdmin)return;const status=$('#auditLogStatus'),body=$('#auditLogBody'),partStatus=$('#auditPartsStatus'),partBody=$('#auditPartsLogBody');if(status)status.textContent='Logboek wordt geladen…';if(partStatus)partStatus.textContent='Onderdeelwijzigingen worden geladen…';try{const data=await adminFetch(AUDIT_LOG_URL);const rows=[];(data.entries||[]).forEach(entry=>(entry.changes||[]).forEach((change,changeIndex)=>rows.push({entry,change,changeIndex})));const partRows=rows.filter(({change})=>change.entityType==='Onderdeel'),otherRows=rows.filter(({change})=>change.entityType!=='Onderdeel');if(status)status.textContent=`${otherRows.length} overige wijziging(en) uit de meest recente logboekregels`;if(partStatus)partStatus.textContent=`${partRows.length} onderdeelwijziging(en) uit de meest recente logboekregels`;if(body)body.innerHTML=otherRows.length?otherRows.map(auditRowHtml).join(''):auditEmptyRow('Nog geen overige wijzigingen gelogd.');if(partBody)partBody.innerHTML=partRows.length?partRows.map(auditRowHtml).join(''):auditEmptyRow('Nog geen onderdeelwijzigingen gelogd.');bindAuditUndoActions()}catch(e){console.error(e);if(status)status.textContent='Logboek kon niet worden geladen: '+e.message;if(partStatus)partStatus.textContent='Onderdeelwijzigingen konden niet worden geladen: '+e.message;if(body)body.innerHTML=auditEmptyRow('Logboek niet beschikbaar.');if(partBody)partBody.innerHTML=auditEmptyRow('Onderdelenlogboek niet beschikbaar.')}}
async function loadAdminPanels()'''
          pattern = r"async function loadAuditLog\(\)\{.*?\nasync function loadAdminPanels\(\)"
          s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'loadAuditLog vervanging mislukt: {n}')
          s = s2

          s = s.replace('v1.52 • Professionele basis', 'v1.54 • Gesplitst wijzigingslogboek', 1)
          p.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          w = sw.read_text(encoding='utf-8').replace('machinepark-v1.53-navigation-fix', 'machinepark-v1.54-audit-parts-split')
          sw.write_text(w, encoding='utf-8')

          build = Path('scripts/build-machinepark.py')
          b = build.read_text(encoding='utf-8')
          b = b.replace('"audit undo": "data-undo-audit",', '"audit undo": "data-undo-audit",\n    "apart onderdelenlogboek": "id=\\"auditPartsLogBody\\"",')
          b = b.replace('machinepark-v1.53-navigation-fix', 'machinepark-v1.54-audit-parts-split')
          build.write_text(b, encoding='utf-8')

          test = Path('tests/build-smoke.test.mjs')
          t = test.read_text(encoding='utf-8')
          t = t.replace("    'data-undo-audit',", "    'data-undo-audit',\n    'id=\"auditPartsLogBody\"',\n    'Overige wijzigingen',")
          t = t.replace("test('service worker forceert nieuwe cache na navigatieherstel', () => {\n  assert.ok(sw.includes('machinepark-v1.53-navigation-fix'));", "test('service worker forceert nieuwe cache na gesplitst wijzigingslogboek', () => {\n  assert.ok(sw.includes('machinepark-v1.54-audit-parts-split'));")
          test.write_text(t, encoding='utf-8')
          PY
      - name: Test Machinepark
        run: npm test
      - name: Verwijder eenmalige workflow en commit
        run: |
          rm .github/workflows/one-time-split-audit-parts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js scripts/build-machinepark.py tests/build-smoke.test.mjs .github/workflows/one-time-split-audit-parts.yml
          git commit -m "Splits onderdeelwijzigingen uit wijzigingslogboek"
          git push origin HEAD:development
