name: Herstel dashboard onderhoud-regressietest

on:
  push:
    branches:
      - synology-selfhost

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Synology-bron
        uses: actions/checkout@v5

      - name: Pas alleen de verouderde maintenance-regex aan
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/actions.test.mjs')
          text = path.read_text(encoding='utf-8')
          old = '  assert.match(dashboard, /target==="maintenance" \\? "maintenance" : "breakdowns"/);'
          new = '  assert.match(dashboard, /target==="maintenance" \\? "maintenance-attention" : "breakdowns"/);'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Verwacht exact 1 verouderde maintenance-regex, gevonden: {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verwijder tijdelijke reparatieworkflow en commit de testfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-dashboard-maintenance-test.yml
          git add tests/actions.test.mjs
          git diff --cached --check
          git commit -m "Align dashboard maintenance regression with KPI drilldown"
          git push origin HEAD:synology-selfhost
