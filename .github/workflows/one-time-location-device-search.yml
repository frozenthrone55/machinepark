name: Eenmalig zoeken op locatie of toestelnummer

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/one-time-location-device-search.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pas zoeken op locatie of toestelnummer toe
        run: python3 scripts/location-device-search.py
      - name: Verwijder tijdelijke patchbestanden
        run: |
          rm scripts/location-device-search.py
          rm .github/workflows/one-time-location-device-search.yml
      - name: Test Machinepark
        run: npm test
      - name: Controleer serverfuncties
        run: npm run check:functions
      - name: Commit wijziging
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Zoek onderhoud en depannage op locatie of toestelnummer'
          git push origin HEAD:development
