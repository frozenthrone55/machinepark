name: Machinepark kwaliteit

on:
  push:
    branches: [development]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Functies syntactisch controleren
        run: npm run check:functions
      - name: Build en automatische tests
        run: npm test
