name: Remove top new button

on:
  push:
    branches:
      - development
    paths:
      - '.github/workflows/remove-top-new.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - name: Remove duplicate top action
        run: python remove-top-new.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Verwijder dubbele + Nieuw knop bovenaan"
          git push origin development
