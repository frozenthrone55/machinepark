name: Machinepark broncode consolideren

on:
  push:
    branches: [development]
    paths:
      - 'scripts/finalize-source.py'
      - '.github/workflows/bake-source.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development
      - name: Broncode genereren en tijdelijke patches verwijderen
        run: python3 scripts/finalize-source.py
      - name: Geconsolideerde broncode committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Geen wijzigingen nodig"
          else
            git commit -m "Consolideer Machinepark broncode"
            git push origin HEAD:development
          fi
