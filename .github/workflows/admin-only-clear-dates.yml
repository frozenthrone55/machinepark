name: Admin only clear service dates

on:
  push:
    branches:
      - development
    paths:
      - '.github/workflows/admin-only-clear-dates.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - name: Apply admin-only migration guard
        run: python scripts/admin-only-clear-dates.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add netlify/functions/machinepark-data.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Beperk onderhoudsdatum migratie tot beheerder"
          git push origin development
