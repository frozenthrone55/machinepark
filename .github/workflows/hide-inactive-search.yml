name: Hide inactive devices from search

on:
  push:
    branches:
      - development
    paths:
      - '.github/workflows/hide-inactive-search.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - name: Apply inactive-device search filter
        run: python scripts/hide-inactive-from-search.py
      - name: Commit search filter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Verberg niet-actieve toestellen buiten Toestellen zoeken"
          git push origin development
