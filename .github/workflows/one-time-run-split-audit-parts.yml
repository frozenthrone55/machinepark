name: Eenmalig gesplitst onderdelenlogboek

on:
  push:
    branches:
      - development
    paths:
      - '.github/workflows/one-time-run-split-audit-parts.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/one-time-split-audit-parts.py
      - run: |
          rm scripts/one-time-split-audit-parts.py
          rm .github/workflows/one-time-run-split-audit-parts.yml
          npm test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Splits onderdeelwijzigingen uit wijzigingslogboek"
          git push origin HEAD:development
