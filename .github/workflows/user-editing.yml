name: User editing

on:
  push:
    branches:
      - development
    paths:
      - '.github/workflows/user-editing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - name: Apply user editing frontend
        run: python scripts/add-user-editing.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Voeg gebruikers bewerken toe aan beheer"
          git push origin development
