name: Eenmalig locatiegerichte depannage

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/one-time-breakdown-location-search.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pas depannage per locatie toe
        run: python3 scripts/breakdown-location-search.py
      - name: Verwijder tijdelijke patchbestanden
        run: |
          rm scripts/breakdown-location-search.py
          rm .github/workflows/one-time-breakdown-location-search.yml
      - name: Test Machinepark
        run: npm test
      - name: Commit wijziging
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Maak depannages locatiegericht'
          git push origin HEAD:development
