name: Eenmalig toestelicoon witter

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/one-time-brighten-device-icon.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Maak toestelicoon volledig wit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = '.device-nav-icon{display:block;width:21px;height:21px;object-fit:contain;filter:brightness(0) invert(1);opacity:.82}.nav button:hover .device-nav-icon,.nav button.active .device-nav-icon{opacity:1}'
          new = '.device-nav-icon{display:block;width:21px;height:21px;object-fit:contain;filter:brightness(0) invert(1);opacity:1}.nav button:hover .device-nav-icon,.nav button.active .device-nav-icon{opacity:1}'
          if old not in text:
              raise SystemExit('CSS voor toestelicoon niet gevonden')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verwijder tijdelijke workflow
        run: rm .github/workflows/one-time-brighten-device-icon.yml
      - name: Test Machinepark
        run: npm test
      - name: Controleer serverfuncties
        run: npm run check:functions
      - name: Commit wijziging
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Maak toestelicoon helderder wit'
          git push origin HEAD:development
