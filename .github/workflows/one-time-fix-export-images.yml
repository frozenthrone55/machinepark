name: Eenmalig herstel exportpatch

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/one-time-fix-export-images.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - name: Herstel Python replacement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/one-time-export-images.yml')
          text=p.read_text(encoding='utf-8')
          text=text.replace("export_block, text, count=1, flags=re.S)", "lambda _: export_block, text, count=1, flags=re.S)", 1)
          text=text.replace("backup_block, text, count=1, flags=re.S)", "lambda _: backup_block, text, count=1, flags=re.S)", 1)
          p.write_text(text,encoding='utf-8')
          PY
          rm .github/workflows/one-time-fix-export-images.yml
      - name: Commit herstel
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Herstel exportpatch en start opnieuw'
          git push origin HEAD:development
