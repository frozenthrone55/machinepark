name: Eenmalig SVG toestelicoon

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/one-time-svg-device-icon.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vervang PNG door inline SVG
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          old_css='.device-nav-icon{display:block;width:21px;height:21px;object-fit:contain;filter:brightness(0) invert(1);opacity:1}.nav button:hover .device-nav-icon,.nav button.active .device-nav-icon{opacity:1}'
          new_css='.device-nav-icon-svg{display:block;width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:1}'
          if old_css not in text:
              raise SystemExit('Oude toestelicoon-CSS niet gevonden')
          text=text.replace(old_css,new_css,1)
          old_html='<span class="icon"><img class="device-nav-icon" src="/machinepark-coffee-device-icon.png" alt="" aria-hidden="true"></span><span class="label">Toestellen</span>'
          new_html='<span class="icon"><svg class="device-nav-icon-svg" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="7" width="10" height="8" rx="1.5"></rect><path d="M15 9h2a2 2 0 0 1 0 4h-2"></path><path d="M7 17h10"></path><path d="M9 5v2"></path><path d="M12 5v2"></path></svg></span><span class="label">Toestellen</span>'
          if old_html not in text:
              raise SystemExit('Oude toestelicoon-HTML niet gevonden')
          text=text.replace(old_html,new_html,1)
          p.write_text(text,encoding='utf-8')

          sw=Path('sw.js')
          sw_text=sw.read_text(encoding='utf-8')
          sw_text=sw_text.replace("const CACHE='machinepark-v1.62-nav-coffee-icon';","const CACHE='machinepark-v1.63-svg-device-icon';",1)
          sw_text=sw_text.replace(",'/machinepark-coffee-device-icon.png'",'',1)
          sw.write_text(sw_text,encoding='utf-8')

          test=Path('tests/build-smoke.test.mjs')
          t=test.read_text(encoding='utf-8')
          t=t.replace("    'machinepark-coffee-device-icon.png',\n    'class=\"device-nav-icon\"',","    'class=\"device-nav-icon-svg\"',\n    'stroke:#fff',",1)
          t=t.replace("machinepark-v1.62-nav-coffee-icon","machinepark-v1.63-svg-device-icon")
          test.write_text(t,encoding='utf-8')

          validator=Path('scripts/build-machinepark.py')
          v=validator.read_text(encoding='utf-8')
          v=v.replace('    "koffietoestelicoon bestand": "machinepark-coffee-device-icon.png",\n','',1)
          v=v.replace('    "wit koffietoestel navigatie-icoon": "class=\\"device-nav-icon\\"",','    "wit koffietoestel SVG navigatie-icoon": "class=\\"device-nav-icon-svg\\"",',1)
          v=v.replace('machinepark-v1.62-nav-coffee-icon','machinepark-v1.63-svg-device-icon')
          validator.write_text(v,encoding='utf-8')
          PY
      - name: Verwijder tijdelijke workflow
        run: rm .github/workflows/one-time-svg-device-icon.yml
      - name: Test Machinepark
        run: npm test
      - name: Controleer serverfuncties
        run: npm run check:functions
      - name: Commit wijziging
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Vervang toestelicoon door witte SVG'
          git push origin HEAD:development
