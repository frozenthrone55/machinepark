name: Eenmalig volgorde laatste activiteiten

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/one-time-activity-order.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pas volgorde laatste activiteiten aan
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = "const events=[...state.maintenance.map(m=>({moment:recordMoment(m),icon:'🔧',title:`${m.type||'Onderhoud'} · ${deviceName(m.deviceId,recordMoment(m))}`})),...state.breakdowns.map(b=>({moment:recordMoment(b),icon:'⚠',title:`${b.issue||'Depannage'} · ${deviceName(b.deviceId,recordMoment(b))}`}))]"
          new = "const events=[...state.maintenance.map(m=>{const moment=recordMoment(m),d=state.devices.find(x=>x.id===m.deviceId),location=d?deviceLocationAt(d,moment):'',code=d?.assetCode||d?.model||'Onbekend toestel',activity=m.type?m.type+' onderhoud':'Onderhoud';return {moment,icon:'🔧',title:[location,code,activity].filter(Boolean).join(' · ')}}),...state.breakdowns.map(b=>{const moment=recordMoment(b),d=state.devices.find(x=>x.id===b.deviceId),location=d?deviceLocationAt(d,moment):'',code=d?.assetCode||d?.model||'Onbekend toestel',activity=b.issue||'Depannage';return {moment,icon:'⚠',title:[location,code,activity].filter(Boolean).join(' · ')}})]"
          if old not in text:
              raise SystemExit('Verwachte dashboardcode niet gevonden; niets gewijzigd.')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
      - name: Test Machinepark
        run: npm test
      - name: Verwijder eenmalige workflow en commit
        run: |
          rm .github/workflows/one-time-activity-order.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rangschik laatste activiteiten per locatie en toestel"
          git push origin HEAD:development
