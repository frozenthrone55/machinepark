name: Eenmalig koffietoestelicoon naar navigatie

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/one-time-move-coffee-icon-to-nav.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verplaats koffietoestelicoon
        run: python3 scripts/move-coffee-icon-to-nav.py
      - name: Verwijder tijdelijke patchbestanden
        run: |
          rm scripts/move-coffee-icon-to-nav.py
          rm .github/workflows/one-time-move-coffee-icon-to-nav.yml
      - name: Test Machinepark
        run: npm test
      - name: Controleer serverfuncties
        run: npm run check:functions
      - name: Commit wijziging
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Verplaats koffietoestelicoon naar navigatie'
          git push origin HEAD:development
