name: Manual service dates

on:
  push:
    branches:
      - development
    paths:
      - '.github/workflows/manual-service-dates.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - name: Apply manual service-date behavior
        run: python scripts/manual-service-dates.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Maak onderhoudsplanning volledig manueel"
          git push origin development
