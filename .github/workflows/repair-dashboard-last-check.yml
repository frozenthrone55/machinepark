name: Herstel dashboard buildvolgorde-regressietest

on:
  push:
    branches:
      - synology-selfhost

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Synology-bron
        uses: actions/checkout@v5

      - name: Pas alleen de resterende foutieve indexOf-assertion aan
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/actions.test.mjs')
          text = path.read_text(encoding='utf-8')
          old = "  assert.ok(cmd.indexOf('python3 build-dashboard-kpi-navigation.py') < cmd.indexOf('node --check service-visits.js'));"
          new = "  assert.ok(cmd.indexOf('python3 build-dashboard-kpi-navigation.py') < cmd.lastIndexOf('node --check service-visits.js'));"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Verwacht exact 1 resterende dashboard-assertion, gevonden: {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verwijder tijdelijke reparatieworkflow en commit de testfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-dashboard-last-check.yml
          git add tests/actions.test.mjs
          git diff --cached --check
          git commit -m "Fix dashboard build-order regression assertion"
          git push origin HEAD:synology-selfhost
