<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Machinepark logo</title>
  <desc id="desc">Koffiekop met stoom, sleutel en schroevendraaier voor service en onderhoud</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4df"/>
      <stop offset="1" stop-color="#f2d2a4"/>
    </linearGradient>
    <linearGradient id="coffee" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8c4f26"/>
      <stop offset="1" stop-color="#4d2612"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="103" fill="none" stroke="#173f35" stroke-width="7" opacity=".15"/>
  <!-- crossed service tools -->
  <g stroke="#173f35" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M48 190 L106 132"/>
    <path d="M40 198 L58 180"/>
    <path d="M151 136 L210 195"/>
  </g>
  <g fill="#173f35">
    <path d="M35 187c-12-8-17-23-12-37l17 17 15-4 4-15-17-17c14-5 29 0 37 12 8 13 7 29-2 40l-22 22c-6 6-15 6-21 0s-5-13 1-18z"/>
    <path d="M207 183l20 20c6 6 6 15 0 21s-15 6-21 0l-20-20z"/>
    <path d="M191 148l25-25c4-4 11-4 15 0l3 3c4 4 4 11 0 15l-25 25z"/>
  </g>
  <!-- cup -->
  <ellipse cx="128" cy="164" rx="63" ry="17" fill="#173f35" opacity=".17"/>
  <path d="M76 115h98v37c0 28-21 50-49 50s-49-22-49-50z" fill="#fffaf2" stroke="#173f35" stroke-width="8"/>
  <path d="M173 124h14c17 0 28 11 28 25s-11 25-28 25h-12" fill="none" stroke="#173f35" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="125" cy="116" rx="46" ry="13" fill="url(#coffee)" stroke="#173f35" stroke-width="6"/>
  <!-- steam -->
  <g fill="none" stroke="#c26f2a" stroke-width="10" stroke-linecap="round">
    <path d="M104 98c-18-20 15-26 0-49"/>
    <path d="M129 94c-17-21 16-27 1-52"/>
    <path d="M153 99c-15-18 13-24 3-43"/>
  </g>
  <!-- small gear -->
  <g transform="translate(184 184)">
    <circle r="27" fill="#173f35"/>
    <circle r="11" fill="#f6dfba"/>
    <g fill="#173f35">
      <rect x="-5" y="-39" width="10" height="15" rx="3"/>
      <rect x="-5" y="24" width="10" height="15" rx="3"/>
      <rect x="24" y="-5" width="15" height="10" rx="3"/>
      <rect x="-39" y="-5" width="15" height="10" rx="3"/>
    </g>
  </g>
</svg>
